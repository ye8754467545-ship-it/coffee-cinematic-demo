<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b2516" />
    <meta name="description" content="نمونه کار: وب‌سایت سینمایی کافه با اسکرول — Portfolio demo of a cinematic scroll-driven café website" />
    <title>کافه نمونه | Scroll Demo</title>
    <link rel="preload" as="image" href="./seq/pour/001.webp" />
    <script>
      // Apply the saved or system theme before first paint.
      (function () {
        var t;
        try { t = localStorage.getItem('scroll-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
